/* Layout: field-guide spreads — a live plate beside its species account, chapters per workflow behind thumb tabs, checklist index at the back. */
:root {
  --ground: #f2f4ef;
  --paper: #fcfdfb;
  --ink: #18201b;
  --muted: #4f5852;
  --rule: #d3d8d0;
  --rule-strong: #98a29a;
  --read: #8aa5b8;
  --read-ink: #31536b;
  --damage: #c2421b;
  --pass: #2a6649;
  --fail: #a3352f;
  --hl: #f0d35a;
  --hl-soft: #f7e9a8;
  --ch-shared: #2f3833;
  --ch-holi: #2a6649;
  --ch-patho: #6a3a7c;
  --ochre: #855a0c;
  --ch-phynder: #2a5986;
  --ch-soibean: #96322f;
  --ch-quick: #1d6670;
  --ch-unicorn: #5a5f14;
  --on-ch: #fcfdfb;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --mast-h: 118px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #111512; --paper: #181d1a; --ink: #e3e8e2; --muted: #a4aea6; --rule: #2d3530; --rule-strong: #56615a;
    --read: #5f7f96; --read-ink: #a6c2d6; --damage: #f06d43; --pass: #6dbf95; --fail: #f2867d; --hl: #b8982c; --hl-soft: #3d3820;
    --ch-shared: #46514a; --ch-holi: #2a6649; --ch-patho: #7b4a8e; --ochre: #855a0c; --ch-phynder: #33679a; --ch-soibean: #a63b37; --ch-quick: #1d6670; --ch-unicorn: #5a5f14; --on-ch: #f7f9f6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #111512; --paper: #181d1a; --ink: #e3e8e2; --muted: #a4aea6; --rule: #2d3530; --rule-strong: #56615a;
  --read: #5f7f96; --read-ink: #a6c2d6; --damage: #f06d43; --pass: #6dbf95; --fail: #f2867d; --hl: #b8982c; --hl-soft: #3d3820;
  --ch-shared: #46514a; --ch-holi: #2a6649; --ch-patho: #7b4a8e; --ochre: #855a0c; --ch-phynder: #33679a; --ch-soibean: #a63b37; --ch-quick: #1d6670; --ch-unicorn: #5a5f14; --on-ch: #f7f9f6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--mast-h) + 24px); }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 400 17px/1.6 var(--f-body);
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ground); }
::selection { background: var(--hl); color: #18201b; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: var(--rule-strong); }
a:hover { text-decoration-color: currentColor; }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; font-variant-ligatures: none; }
html { scrollbar-color: var(--rule-strong) var(--ground); }
input { caret-color: var(--damage); }
.skip { position: absolute; left: var(--gutter-l); top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 40; padding: 10px 14px; background: var(--ink); color: var(--ground); font: 650 14px/1 var(--f-display); border-radius: 4px; transform: translateY(-160%); }
.skip:focus { transform: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: -1px; padding: 0; border: 0; }
.fig .mark circle.hit { fill: transparent; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

/* Masthead */
.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ground); border-bottom: 1px solid var(--rule); }
.mast-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 24px; padding-block: 14px 12px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand h1 { margin: 0; font: 800 26px/1 var(--f-display); font-stretch: 78%; letter-spacing: -0.01em; }
.brand p { margin: 0; font: 500 13px/1.3 var(--f-display); color: var(--muted); letter-spacing: 0.01em; }
.snap { font: 500 13px/1.3 var(--f-display); color: var(--muted); text-align: right; white-space: nowrap; }
.snap a { color: var(--muted); }

.search { position: relative; z-index: 3; justify-self: end; width: min(100%, 520px); }
.search-box { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; background: var(--paper); border: 1px solid var(--rule-strong); border-radius: 6px; }
.search-box:focus-within { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hl) 55%, transparent); }
.search-box svg { flex: none; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
.search-box input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 400 16px/1 var(--f-body); outline: none; }
.search-box input::placeholder { color: var(--muted); opacity: 1; }
.search-box input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.qclear { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 4px; background: none; cursor: pointer; }
.qclear[hidden] { display: none; }
.qclear svg { width: 16px; height: 16px; stroke: var(--muted); }
.qclear:hover svg { stroke: var(--ink); }
.cl-snap { display: none; }
.kbd { font: 600 12px/1 var(--f-mono); color: var(--muted); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 3px 6px; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px; list-style: none; background: var(--paper); border: 1px solid var(--rule-strong); border-radius: 8px; box-shadow: 0 12px 32px -12px rgb(0 0 0 / 0.28); max-height: min(60vh, 460px); overflow-y: auto; }
.results li { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr) auto; align-items: baseline; gap: 12px; padding: 9px 10px; border-radius: 5px; cursor: pointer; }
.results li[aria-selected="true"] { background: var(--hl-soft); }
.results .r-sym { font: 600 14px/1.3 var(--f-mono); }
.results .r-name { font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .r-wf { display: flex; gap: 4px; }
.results .empty { display: block; padding: 12px 10px; color: var(--muted); font-size: 15px; cursor: default; }

/* Thumb tabs */
.tabs { position: relative; z-index: 1; display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; padding-top: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 14px 7px; border-radius: 6px 6px 0 0; background: var(--tab); color: var(--on-ch); font: 650 14px/1.1 var(--f-display); font-stretch: 85%; text-decoration: none; letter-spacing: 0.01em; transform: translateY(3px); transition: transform 160ms cubic-bezier(.2,.7,.2,1); }
.tab:hover, .tab[aria-current="true"] { transform: translateY(0); }
.tab .n { font: 500 12px/1 var(--f-mono); }
.tab.checklist { background: var(--paper); color: var(--ink); border: 1px solid var(--rule-strong); border-bottom: 0; }

/* Chapters */
main { padding-block: 32px 96px; }
.chapter { margin-bottom: 72px; }
.ch-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 8px 32px; background: var(--chc); color: var(--on-ch); padding: 28px 32px 24px; border-radius: 4px 4px 0 0; }
.ch-head h2 { margin: 0; font: 800 clamp(34px, 4.4vw, 52px)/0.95 var(--f-display); font-stretch: 72%; letter-spacing: -0.015em; text-wrap: balance; }
.ch-head p { margin: 10px 0 0; max-width: 62ch; font-size: 17px; line-height: 1.5; color: var(--on-ch); }
.ch-meta { font: 500 14px/1.5 var(--f-display); text-align: right; color: var(--on-ch); }
.ch-meta a { color: var(--on-ch); }
.ch-body { border: 1px solid var(--rule); border-top: 0; background: var(--ground); }

/* Account spread */
.account { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 0; border-top: 1px solid var(--rule); }
.account:first-child { border-top: 0; }
.plate-col { padding: 28px; border-right: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 55%, var(--ground)); }
.plate { position: sticky; top: calc(var(--mast-h) + env(safe-area-inset-top, 0px) + 20px); margin: 0; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 14px; }
.svgwrap { overflow-x: auto; overflow-y: hidden; margin: -4px; padding: 4px; scrollbar-width: thin; }
.svgwrap.more { -webkit-mask-image: linear-gradient(to right, #000 92%, transparent); mask-image: linear-gradient(to right, #000 92%, transparent); }
.svgwrap.less { -webkit-mask-image: linear-gradient(to left, #000 92%, transparent); mask-image: linear-gradient(to left, #000 92%, transparent); }
.svgwrap.more.less { -webkit-mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent); }
.plate svg.fig { display: block; width: 100%; height: auto; overflow: visible; }

    for (let i = 0; i <= G; i++) { const c = i < G && depth[i] > 0; if (c && s < 0) s = i; if (!c && s >= 0) { runs.push([s, i]); s = -1; } }
    runs.forEach(([a, b]) => rect(g, x0 + a * sx, 208, (b - a) * sx, 8, "inkf"));
    T(g, x0, 18, "reads (60 bp)", "lbl"); if (over) T(g, 580, 18, `+${over} reads deeper than drawn`, null, "end");

        { sym: "tad80", label: "tad80", value: `${f(tad, 2)}×` },
        { sym: "gini / n_gini", label: "gini", value: f(gini, 2) },

};

        h("td", {}, h("span", { class: "also" }, ...r.wf.map(w => wfChip(w)))),
        h("td", { class: "pl" }, h("a", { href: "#" + r.slug }, `Plate ${r.acc.plateNo} · ${r.acc.title}`))));
    });
  }
  fill();
  main.append(sec);
  main.append(h("p", { class: "foot", html: `Built from the aeDNA dictionary in the lab wiki (snapshot ${D.snapshot}). Plates use synthetic data to show what each parameter does; none of the drawn values are results from a sample. To update, re-export <code>data.js</code> from the dictionary.` }));
})();

const snapDate = new Date(D.snapshot + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
$("#countline").innerHTML = `${rows.length} entries ${SCOPE ? SCOPE.countLabel : `across ${Object.keys(D.workflows).length} workflows`}<span class="cl-snap"> · snapshot ${snapDate}</span>`;
$("#snap").innerHTML = (SCOPE && SCOPE.hideNotion) || !D.source ? `Dictionary snapshot ${snapDate}` : `Dictionary snapshot ${snapDate}<br><a href="${D.source}" target="_blank" rel="noopener">Open in Notion</a>`;

/* ---------- field-mark linking ---------- */
function light(accId, sym) {
  const art = document.getElementById(accId); if (!art) return;
  art.querySelectorAll(".lit").forEach(e => e.classList.remove("lit"));
  if (sym == null) { lit = null; return; }
  lit = { acc: accId, sym };
  art.querySelectorAll(`[data-sym="${CSS.escape(sym)}"]`).forEach(e => { e.classList.add("lit"); if (e.classList.contains("mark") && !e.contains(document.activeElement)) reveal(e); });
}
const target = e => { const el = e.target.closest && e.target.closest("[data-sym]"); const art = el && el.closest(".account"); return el && art ? [art.id, el.getAttribute("data-sym"), el] : null; };
main.addEventListener("mouseover", e => { const t = target(e); if (t) light(t[0], t[1]); });
main.addEventListener("mouseout", e => { const t = target(e); if (t && !(e.relatedTarget && t[2].contains(e.relatedTarget))) light(t[0], null); });
main.addEventListener("focusin", e => { const t = target(e); if (t) light(t[0], t[1]); });
main.addEventListener("focusout", e => { const t = target(e); if (t) light(t[0], null); });
function reveal(m) {
  const wrap = m.closest(".svgwrap"); if (!wrap || wrap.scrollWidth <= wrap.clientWidth + 2) return;
  const wr = wrap.getBoundingClientRect(), mr = m.querySelector("circle.dotc").getBoundingClientRect();
  const pad = 28; let d = 0;
  if (mr.right > wr.right - pad) d = mr.right - wr.right + pad; else if (mr.left < wr.left + pad) d = mr.left - wr.left - pad;
  if (d) wrap.scrollTo({ left: wrap.scrollLeft + d, behavior: reduced ? "auto" : "smooth" });
}
function pulse(art, sym) {
  art.querySelectorAll(`.mark[data-sym="${CSS.escape(sym)}"]`).forEach(m => { reveal(m); m.classList.remove("pulse"); void m.getBoundingClientRect(); m.classList.add("pulse"); setTimeout(() => m.classList.remove("pulse"), 600); });
}
const cue = w => { w.classList.toggle("more", w.scrollLeft + w.clientWidth < w.scrollWidth - 4); w.classList.toggle("less", w.scrollLeft > 4); };
document.querySelectorAll(".svgwrap").forEach(w => { cue(w); w.addEventListener("scroll", () => cue(w), { passive: true }); new ResizeObserver(() => cue(w)).observe(w); });
main.addEventListener("click", e => {
  const m = e.target.closest(".mark"); if (!m) return;
  const art = m.closest(".account"), sym = m.getAttribute("data-sym"), r = bySym.get(sym);
  const li = document.getElementById(r.slug);
  li.scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" });
  flash(li); pulse(art, sym);
});
main.addEventListener("keydown", e => {
  const m = e.target.closest && e.target.closest(".mark"); if (!m) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); m.dispatchEvent(new MouseEvent("click", { bubbles: true })); return; }
  const ms = [...m.parentNode.querySelectorAll(".mark")], i = ms.indexOf(m);
  const j = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: ms.length - 1 }[e.key];
  if (j == null) return;
  e.preventDefault();
  const next = ms[(j + ms.length) % ms.length], acc = ACCOUNTS[m.closest(".account").id];
  ms.forEach(x => x.setAttribute("tabindex", x === next ? "0" : "-1"));
  acc.activeSym = next.getAttribute("data-sym"); next.focus();
});
function flash(el) { el.classList.remove("found"); void el.offsetWidth; el.classList.add("found"); setTimeout(() => el.classList.remove("found"), 2600); }

/* ---------- navigation ---------- */
function go(slug, smooth = true) {
  const r = rows.find(x => x.slug === slug);
  if (!r) { const el = document.getElementById(slug); if (el) el.scrollIntoView({ block: "start", behavior: smooth && !reduced ? "smooth" : "auto" }); return; }
  const li = document.getElementById(r.slug), art = li.closest(".account");
  const wide = matchMedia("(min-width: 1081px)").matches;
  (wide ? li : art.querySelector(".plate")).scrollIntoView({ block: wide ? "center" : "start", behavior: smooth && !reduced ? "smooth" : "auto" });
  flash(li); light(art.id, K(r)); pulse(art, K(r));
  setTimeout(() => { if (lit && lit.sym === K(r)) light(art.id, null); }, 2600);
}
function onHash(smooth) { const s = decodeURIComponent(location.hash.slice(1)); if (s) go(s, smooth); }
window.addEventListener("hashchange", () => onHash(true));
const open = slug => { if (location.hash === "#" + slug) go(slug); else location.hash = slug; };

/* active tab */
const tabEls = [...tabs.querySelectorAll(".tab")];
const io = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { const id = e.target.id.replace(/^ch-/, ""); tabEls.forEach(t => t.setAttribute("aria-current", t.dataset.ch === id ? "true" : "false")); } });
}, { rootMargin: "-40% 0px -55% 0px" });
document.querySelectorAll(".chapter").forEach(s => io.observe(s));

/* ---------- search ---------- */
const q = $("#q"), list = $("#results");
const norm = s => (s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "");
const GREEK = { theta: "θ", beta: "β", epsilon: "ε", eps: "ε", pi: "π", phi: "φ", sigma: "σ" };
let hits = [], sel = 0;
function score(r, t) {
  const sym = norm(r.symbol), al = norm(r.aliases), nm = norm(r.name);
  const parts = sym.split(/\s*[\/,]\s*/).concat(al.split(/[\s,;]+/));
  if (parts.includes(t) || sym === t) return 100;
  if (parts.some(p => p.startsWith(t))) return 80;
  if (sym.includes(t)) return 60;
  if (al.includes(t)) return 50;
  if (nm.startsWith(t)) return 45;
  if (nm.includes(t)) return 35;
  if (norm(r.def).includes(t)) return 10;
  return 0;
}
function search() {
  const raw = q.value.trim(), t = norm(GREEK[norm(raw)] || raw);
  list.textContent = "";
  if (!t) { list.hidden = true; q.setAttribute("aria-expanded", "false"); return; }
  hits = rows.map(r => [score(r, t), r]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0] || a[1].symbol.length - b[1].symbol.length).slice(0, 9).map(x => x[1]);
  sel = 0;
  if (!hits.length) {
    list.append(h("li", { class: "empty", role: "option", "aria-disabled": "true" }, `No entry matches “${raw}”. Search covers symbols, aliases and full names, for example fwf, nreads or posterior.`));
  } else hits.forEach((r, i) => {
    const li = h("li", { role: "option", id: "opt-" + i, "aria-selected": i === 0 ? "true" : "false" },
      h("span", { class: "r-sym" }, r.symbol), h("span", { class: "r-name" }, r.name), h("span", { class: "r-wf" }, ...r.wf.map(w => h("span", { class: "wf-chip", style: `--tab: var(${WF_TAB[w]})` }, h("i"), D.workflows[w].name))));
    li.addEventListener("mousedown", e => { e.preventDefault(); choose(i); });
    list.append(li);
  });
  list.hidden = false; q.setAttribute("aria-expanded", "true"); q.setAttribute("aria-activedescendant", hits.length ? "opt-0" : "");
}
function move(d) {
  if (!hits.length) return;
  sel = (sel + d + hits.length) % hits.length;
  [...list.children].forEach((li, i) => li.setAttribute("aria-selected", i === sel ? "true" : "false"));
  q.setAttribute("aria-activedescendant", "opt-" + sel);
  list.children[sel].scrollIntoView({ block: "nearest" });
}
function choose(i) { const r = hits[i]; if (!r) return; list.hidden = true; q.setAttribute("aria-expanded", "false"); q.blur(); open(r.slug); }
const clear = $("#qclear");
const syncClear = () => { clear.hidden = !q.value; };
q.addEventListener("input", () => { syncClear(); search(); });
clear.addEventListener("click", () => { q.value = ""; syncClear(); search(); q.focus(); });
q.addEventListener("focus", () => { if (q.value.trim()) search(); });
q.addEventListener("blur", () => setTimeout(() => { list.hidden = true; q.setAttribute("aria-expanded", "false"); }, 120));
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "Enter") { e.preventDefault(); choose(sel); }
  else if (e.key === "Escape") { q.value = ""; syncClear(); search(); q.blur(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q && !/input|select|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); q.select(); }
});

/* masthead height for sticky offsets */
const mast = $(".mast");
const setMast = () => document.documentElement.style.setProperty("--mast-h", mast.offsetHeight + "px");
setMast(); new ResizeObserver(setMast).observe(mast);

if (location.hash) setTimeout(() => onHash(false), 120);
})();

</script>
